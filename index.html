<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sapecagem</title>
<style>
  body { font-family: sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#ffe0e0;}
  button { margin:10px; padding:15px 30px; font-size:20px; border:none; border-radius:10px; cursor:pointer;}
  #sim { background:#4CAF50; color:white;}
  #nao { background:#f44336; color:white;}
  #status { margin-top:20px; font-size:18px; }
</style>
</head>
<body>
<h1>Está afim?</h1>
<button id="sim">Sim 😏</button>
<button id="nao">Não 😅</button>
<div id="status"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  // Configuração do Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_ID",
    appId: "SEU_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const user = prompt("Digite seu nome (ex: Kaique ou Ela)"); // Login simples
  const statusDiv = document.getElementById("status");

  document.getElementById("sim").onclick = () => {
    db.ref('users/' + user).set({ choice: 'sim' });
  };
  document.getElementById("nao").onclick = () => {
    db.ref('users/' + user).set({ choice: 'nao' });
  };

  // Atualiza em tempo real
  db.ref('users').on('value', snapshot => {
    const data = snapshot.val();
    if(data){
      let display = '';
      for(let key in data){
        display += key + ': ' + data[key].choice + '<br>';
      }
      statusDiv.innerHTML = display;
    }
  });
</script>
</body>
</html>
